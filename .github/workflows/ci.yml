name: Guardrails CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic adversarial suite
        run: python -m refund_guard.runner
      - name: Compromised model simulation
        run: python -m refund_guard.runner --simulate-compromised-model
